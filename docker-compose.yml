services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: biblioteca
    ports:
      - "3307:3306"
    volumes:
      - dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DIALECT: mysql
      HOST: db
      DB_USERNAME: root
      PASSWORD: root
      DATABASE: biblioteca
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    command: sh -c "yarn sequelize-cli db:migrate && node src/server.js"

volumes:
  dados: